name: 오늘의 백준
on:
  workflow_dispatch:
  schedule:
    # Stage solves synced overnight, then check again at 06:00 Asia/Seoul.
    - cron: '40 20 * * *'
    - cron: '0 21 * * *'
  push:
    branches: [main]
    paths:
      - '백준/**'
      - '.github/daily-boj/**'
      - '.github/workflows/daily-boj.yml'

concurrency:
  group: daily-boj-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/configure-pages@v5
        id: pages
      - name: 풀이 확인 및 다음 문제 예약
        run: python3 .github/daily-boj/build.py
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          SOLVED_AC_CLIENT_ID: ${{ secrets.SOLVED_AC_CLIENT_ID }}
          SOLVED_AC_CLIENT_SECRET: ${{ secrets.SOLVED_AC_CLIENT_SECRET }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
