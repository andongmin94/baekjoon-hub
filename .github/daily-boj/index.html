<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>오늘의 백준</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&amp;family=Open+Sans:wght@400;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.65 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI',
        'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', '나눔바른고딕',
        '나눔고딕', '맑은고딕', 'Helvetica Neue', Helvetica, Arial, sans-serif,
        'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
    }
    body { margin: 0; padding: 16vh 20px 2rem; }
    main { max-width: 30rem; margin: 0 auto; }
    h1 { margin: 0; font-size: 1.75rem; line-height: 1.25; font-weight: 400; }
    p { margin: .65rem 0; word-break: keep-all; }
    nav { display: grid; gap: .4rem; justify-items: start; }
    a { color: #075b96; text-underline-offset: .18em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    .primary {
      display: inline-block; margin: .5rem 0 .85rem; padding: .6rem 1rem;
      background: #075b96; color: white; border-radius: .4rem;
      font-weight: 700; text-decoration: none;
    }
    .primary:focus-visible { outline-color: #347fb5; }
    #recap { margin-top: 1.75rem; }
    .recap-heading {
      display: flex; align-items: baseline; justify-content: space-between;
      border-bottom: 1px solid #b7c5cf;
    }
    .recap-heading h2 {
      font-size: 1.125rem; font-weight: 400; margin: 0 0 -1px;
      padding-bottom: .35rem; border-bottom: 2px solid #0076b9;
    }
    #solved-count, .problem-number { color: #536171; font-size: .875rem; }
    #solved-list { list-style: none; padding: 0; margin: 0; }
    #solved-list li { border-bottom: 1px solid #d9e1e6; }
    #solved-list a {
      display: flex; align-items: baseline; gap: .8rem;
      padding: .65rem .15rem; overflow-wrap: anywhere;
    }
    .problem-number { flex: none; font-variant-numeric: tabular-nums; }
    #week { width: 100%; margin-top: 1.6rem; table-layout: fixed; border-collapse: collapse; }
    #week caption { text-align: left; padding-bottom: .4rem; font-size: 1rem; }
    #week th, #week td { text-align: center; font-variant-numeric: tabular-nums; }
    #week th { font-size: .8rem; font-weight: 400; color: #536171; }
    #week td { font-size: .95rem; }
    #week th:last-child, #week td:last-child { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      a { color: #8bc9ff; }
      .primary { background: #8bc9ff; color: #102234; }
      #solved-count, .problem-number, #week th { color: #b1beca; }
      .recap-heading, #solved-list li { border-bottom-color: #44515b; }
    }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">오늘의 백준</h1>
    <p id="status" role="status">오늘의 추천을 확인하고 있어요.</p>
    <a id="extra" class="primary" hidden>다음 문제 풀기</a>
    <a id="problem" hidden>백준에서 문제 열기</a>
    <section id="recap" aria-labelledby="recap-title" hidden>
      <div class="recap-heading">
        <h2 id="recap-title">오늘 푼 문제</h2>
        <span id="solved-count"></span>
      </div>
      <ul id="solved-list"></ul>
      <table id="week" hidden>
        <caption>최근 7일간 푼 문제 수</caption>
        <thead><tr id="week-days"></tr></thead>
        <tbody><tr id="week-counts"></tr></tbody>
      </table>
    </section>
    <nav id="fallback" aria-label="추천을 확인할 수 없을 때" hidden>
      <a href="https://solved.ac/problems?q=lang%3Ako%20oj%3Aboj%20-solved_by%3Aandongmin94%20tier%3Ab5..r1&amp;sort=level&amp;direction=asc">내가 아직 풀지 않은 한국어 문제 보기</a>
      <a href="https://github.com/andongmin94/baekjoon-hub/settings/secrets/actions">GitHub Actions 시크릿 설정</a>
    </nav>
    <noscript>자동으로 문제를 열려면 자바스크립트를 켜 주세요.</noscript>
  </main>
  <script>
    const statusText = document.getElementById('status');
    const problemLink = document.getElementById('problem');
    const fallback = document.getElementById('fallback');

    function todayInKorea() {
      const date = new Intl.DateTimeFormat('en', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
      });
      const shiftedTime = new Date(Date.now() - 6 * 60 * 60 * 1000);
      const parts = Object.fromEntries(date.formatToParts(shiftedTime).map(({type, value}) => [type, value]));
      return [parts.year, parts.month, parts.day].join('-');
    }

    function showRecap(recap, today, currentId) {
      const problems = recap?.day === today ? recap.solved : [];
      const list = document.getElementById('solved-list');
      if (!problems.some(problem => problem.id === currentId)) {
        problems.push({id: currentId});
      }
      for (const {id, title} of problems) {
        const row = document.createElement('li');
        const link = document.createElement('a');
        link.href = 'https://www.acmicpc.net/problem/' + id;
        if (title) {
          const number = document.createElement('span');
          number.className = 'problem-number';
          number.textContent = id + '번';
          link.append(number, title);
        } else {
          link.textContent = '백준 ' + id + '번';
        }
        row.append(link);
        list.append(row);
      }
      document.getElementById('solved-count').textContent = problems.length + '문제';
      if (recap?.day === today && recap.week?.length === 7) {
        const dates = document.getElementById('week-days');
        const counts = document.getElementById('week-counts');
        const date = new Date(today + 'T00:00:00Z');
        date.setUTCDate(date.getUTCDate() - 6);
        for (const [i, count] of recap.week.entries()) {
          const label = document.createElement('th');
          label.scope = 'col';
          label.textContent = (date.getUTCMonth() + 1) + '/' + date.getUTCDate();
          const value = document.createElement('td');
          value.textContent = i === 6 ? problems.length : count;
          dates.append(label);
          counts.append(value);
          date.setUTCDate(date.getUTCDate() + 1);
        }
        document.getElementById('week').hidden = false;
      }
      document.getElementById('recap').hidden = false;
    }

    async function openToday() {
      const today = todayInKorea();
      try {
        const response = await fetch('./picks.json?day=' + today, {cache: 'no-store'});
        if (!response.ok) throw new Error('fetch');
        const data = await response.json();
        const days = Object.keys(data.picks).sort();
        const activeDay = days.filter(day => day <= today).pop();
        const id = data.picks[activeDay];
        if (!Number.isSafeInteger(id) || id <= 0) {
          statusText.textContent = '오늘 날짜로 등록된 추천 문제가 없어요.';
          fallback.hidden = false;
          return;
        }
        problemLink.href = 'https://www.acmicpc.net/problem/' + id;
        problemLink.textContent = '백준 ' + id + '번 문제 열기';
        problemLink.hidden = false;
        const nextDay = days.find(day => day > today);
        if (data.rule === 'until-solved' && nextDay !== undefined) {
          document.getElementById('heading').textContent = '오늘 문제는 이미 풀었어요';
          problemLink.hidden = true;
          showRecap(data.recap, today, id);
          const extraId = data.picks[nextDay];
          if (Number.isSafeInteger(extraId) && extraId > 0 && extraId !== id) {
            const extraLink = document.getElementById('extra');
            extraLink.href = 'https://www.acmicpc.net/problem/' + extraId;
            extraLink.hidden = false;
            statusText.textContent = '정규 추천은 다음 오전 6시에 바뀌어요.';
          } else {
            statusText.textContent = '지금 추천할 추가 문제가 없어요.';
          }
          return;
        }
        statusText.textContent = '오늘의 문제로 이동합니다.';
        window.location.replace(problemLink.href);
      } catch {
        statusText.textContent = '오늘의 추천을 불러올 수 없어요.';
        fallback.hidden = false;
      }
    }

    openToday();
  </script>
</body>
</html>
